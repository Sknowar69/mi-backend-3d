<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Proyecto - OrgaProp</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyberDark: '#09090e',
            cyberCard: '#13131a',
            cyberBlue: '#00f2fe',
            cyberPurple: '#9d4edd',
            cyberPink: '#ff007f'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos Cyberpunk Personalizados -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090e;
      color: #ffffff;
      overflow-x: hidden;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    
    .font-rajdhani {
      font-family: 'Rajdhani', sans-serif;
    }

    /* Cuadrícula de Fondo */
    .bg-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Línea Scanline */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(0, 242, 254, 0.08);
      z-index: 50;
      pointer-events: none;
      animation: scanlineAnim 6s linear infinite;
    }

    @keyframes scanlineAnim {
      0% { top: -10px; }
      100% { top: 100%; }
    }

    /* Animación parpadeo de terminal */
    .terminal-blink {
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Tarjeta Ciberpunk con Corchetes */
    .cyber-card {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(19, 19, 26, 0.75);
      backdrop-filter: blur(12px);
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 12px;
      height: 12px;
      border-top: 2px solid #00f2fe;
      border-left: 2px solid #00f2fe;
    }

    .cyber-card::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 12px;
      height: 12px;
      border-bottom: 2px solid #9d4edd;
      border-right: 2px solid #9d4edd;
    }

    .neon-border-blue:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4), 0 0 30px rgba(0, 242, 254, 0.2);
    }

    /* Doble Anillo Giratorio */
    .spinner-outer {
      border-top-color: #00f2fe;
      border-left-color: #00f2fe;
      animation: spin-clockwise 1.5s linear infinite;
    }
    .spinner-inner {
      border-bottom-color: #9d4edd;
      border-right-color: #9d4edd;
      animation: spin-counter 1.2s linear infinite;
    }

    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Regla vertical de la barra */
    .ruler-mark::after {
      content: '|';
      color: rgba(255,255,255,0.15);
      font-size: 8px;
    }
  </style>

  <!-- React y Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="relative min-h-screen flex flex-col justify-between bg-cyberDark">

  <!-- Capas de fondo ambientación -->
  <div class="absolute inset-0 bg-grid z-0"></div>
  <div class="scanline"></div>

  <!-- Destellos de luz radiales -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-[radial-gradient(circle,_rgba(0,242,254,0.06)_0%,_transparent_70%)] pointer-events-none"></div>
  <div class="absolute bottom-40 right-0 w-96 h-96 bg-[radial-gradient(circle,_rgba(157,78,237,0.06)_0%,_transparent_70%)] pointer-events-none"></div>

  <!-- Header Fijo de la Landing -->
  <header class="relative z-10 w-full max-w-5xl mx-auto px-6 py-5 flex justify-between items-center border-b border-white/5">
    <div class="font-orbitron font-bold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyberBlue to-white">
      ORGAPROP
    </div>
    <div class="flex items-center space-x-2 font-rajdhani text-xs tracking-widest text-cyberBlue font-bold">
      <span class="w-2 h-2 rounded-full bg-cyberBlue animate-pulse"></span>
      <span>SISTEMA EN LÍNEA</span>
    </div>
  </header>

  <!-- Contenedor Principal SPA -->
  <main id="root" class="relative z-10 w-full max-w-4xl mx-auto px-4 my-10 flex-grow flex items-center justify-center"></main>

  <!-- Footer Fijo de Soporte Directo -->
  <footer class="relative z-10 w-full text-center py-6 border-t border-white/5 font-rajdhani text-xs tracking-widest text-gray-500 bg-cyberDark/50">
    <p>Para detalles adicionales, acotaciones especiales o dudas sobre tu código,</p>
    <p class="mt-1">comunícate directamente con nuestra central de atención al: <span class="text-cyberBlue font-bold font-sans">+56 9 1234 5678</span></p>
  </footer>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function TrackerApp() {
      const [trackingCode, setTrackingCode] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [projectData, setProjectData] = useState(null);

      // Re-inicializar iconos de Lucide al renderizar componentes
      useEffect(() => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }, [loading, errorMsg, projectData]);

      const handleSearch = async (e) => {
        e.preventDefault();
        if (trackingCode.length !== 5) return;

        setLoading(true);
        setErrorMsg('');
        setProjectData(null);

        try {
          const res = await fetch(`/api/proyectos/seguimiento/${trackingCode.toUpperCase()}`);
          const data = await res.json();

          if (!res.ok) {
            setErrorMsg(data.error || 'Código de seguimiento no encontrado. Verifica e intenta de nuevo.');
          } else {
            setProjectData(data);
          }
        } catch (err) {
          setErrorMsg('Error de conexión con la central de datos. Inténtalo de nuevo.');
        } finally {
          setLoading(false);
        }
      };

      const handleBack = () => {
        setProjectData(null);
        setTrackingCode('');
        setErrorMsg('');
      };

      // Formateador de fecha en español
      const formatFecha = (fechaStr) => {
        if (!fechaStr) return 'No definida';
        const date = new Date(fechaStr + 'T00:00:00');
        return date.toLocaleDateString('es-ES', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      };

      return (
        <div className="w-full flex justify-center">
          {/* ESTADO DE CARGA */}
          {loading && (
            <div className="flex flex-col items-center justify-center space-y-6 py-10">
              <div className="relative w-20 h-20">
                <div className="spinner-outer absolute inset-0 rounded-full border-4 border-transparent border-t-cyberBlue border-l-cyberBlue"></div>
                <div className="spinner-inner absolute inset-2 rounded-full border-4 border-transparent border-b-cyberPurple border-r-cyberPurple"></div>
              </div>
              <div className="font-orbitron text-cyberBlue text-sm tracking-widest font-bold terminal-blink">
                CONSULTANDO SISTEMAS...
              </div>
            </div>
          )}

          {/* VISTA 1: BUSCADOR CENTRALIZADO */}
          {!loading && !projectData && (
            <div className="w-full max-w-lg">
              <div className="text-center mb-8">
                <h2 className="font-orbitron text-xl md:text-2xl font-black tracking-widest mb-3">
                  MONITOREO DE PROYECTO
                </h2>
                <p className="text-xs md:text-sm text-gray-400 max-w-md mx-auto leading-relaxed">
                  Introduce tu código alfanumérico único de 5 dígitos para verificar la posición de tu prop en la cola y su fecha estimada de despacho.
                </p>
              </div>

              {errorMsg && (
                <div className="mb-6 p-4 border border-cyberPink bg-cyberPink/10 text-cyberPink text-xs font-orbitron flex items-center space-x-2 animate-pulse rounded-none">
                  <i data-lucide="alert-triangle" className="w-4 h-4 flex-shrink-0"></i>
                  <span>{errorMsg}</span>
                </div>
              )}

              <form onSubmit={handleSearch} className="cyber-card p-6 flex flex-col sm:flex-row gap-4">
                <div className="relative flex-grow">
                  <input
                    type="text"
                    maxLength={5}
                    required
                    placeholder="EJ: 623YD"
                    value={trackingCode}
                    onChange={(e) => setTrackingCode(e.target.value.toUpperCase())}
                    className="w-full bg-cyberDark/80 border border-white/10 rounded-none px-4 py-4 text-center font-orbitron text-lg tracking-widest text-cyberBlue focus:outline-none neon-border-blue transition duration-300"
                  />
                  {trackingCode.length > 0 && (
                    <button
                      type="button"
                      onClick={() => setTrackingCode('')}
                      className="absolute right-3 top-4.5 text-gray-500 hover:text-cyberPink transition"
                    >
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  )}
                </div>

                <button
                  type="submit"
                  disabled={trackingCode.length !== 5}
                  className={`px-8 py-4 font-rajdhani font-bold tracking-widest text-sm transition duration-300 rounded-none flex items-center justify-center space-x-2 ${
                    trackingCode.length === 5
                      ? 'bg-gradient-to-r from-cyberBlue to-cyan-500 text-cyberDark hover:-translate-y-0.5 hover:shadow-[0_0_15px_rgba(0,242,254,0.5)] cursor-pointer'
                      : 'bg-white/5 text-gray-500 opacity-50 pointer-events-none'
                  }`}
                >
                  <i data-lucide="search" className="w-4 h-4"></i>
                  <span>CONSULTAR //</span>
                </button>
              </form>
            </div>
          )}

          {/* VISTA 2: PANEL DE SEGUIMIENTO ACTIVO */}
          {!loading && projectData && (
            <div className="cyber-card w-full p-6 md:p-8 shadow-2xl space-y-8 animate-fade-in">
              
              {/* CABECERA TÉCNICA */}
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-white/5 pb-5 gap-4">
                <div className="flex flex-col space-y-1">
                  <span className="font-orbitron text-xs text-cyberBlue font-bold tracking-wider">
                    SEGUIMIENTO ACTIVO // CÓDIGO: {projectData.proyecto.codigo_seguimiento}
                  </span>
                  <h3 className="font-orbitron text-lg md:text-xl font-bold tracking-wide text-white uppercase mt-1">
                    {projectData.proyecto.nombre}
                  </h3>
                </div>
                
                <div className="flex items-center space-x-3 border-l-0 md:border-l border-white/10 pl-0 md:pl-5">
                  <span className="font-rajdhani text-xs text-gray-500 tracking-widest font-semibold uppercase">PROCESA:</span>
                  <span className="font-orbitron text-sm text-transparent bg-clip-text bg-gradient-to-r from-cyberBlue to-white font-bold">
                    {projectData.proyecto.colaborador_nombre}
                  </span>
                </div>
              </div>

              {/* MATRIZ DE INFORMACIÓN (3 BLOQUES) */}
              <div className="grid grid-cols-1 sm:grid-cols-3 border border-white/5 bg-black/40 rounded-none divide-y sm:divide-y-0 sm:divide-x divide-white/5">
                <div className="p-5 flex flex-col justify-center">
                  <span className="font-rajdhani text-xs text-gray-500 tracking-wider font-semibold uppercase mb-1">Cliente Asignado</span>
                  <span className="font-sans text-sm font-semibold text-white truncate uppercase">
                    {projectData.proyecto.cliente_nombre || 'Cliente Final'}
                  </span>
                </div>

                <div className="p-5 flex flex-col justify-center">
                  <span className="font-rajdhani text-xs text-gray-500 tracking-wider font-semibold uppercase mb-1">Categoría Manufactura</span>
                  <span className="font-sans text-xs bg-cyberCard px-3 py-1 border border-white/5 self-start text-cyberBlue font-semibold uppercase rounded-none mt-1">
                    {projectData.proyecto.categoria_nombre}
                  </span>
                </div>

                <div className="p-5 flex flex-col justify-center">
                  <span className="font-rajdhani text-xs text-gray-500 tracking-wider font-semibold uppercase mb-1">Posición en Cola de Espera</span>
                  <div className="flex items-baseline space-x-1 mt-1">
                    <span className="font-orbitron text-2xl font-black text-cyberPurple">
                      {projectData.proyecto.estado === 'Completado' ? '—' : projectData.proyecto.orden_lista}
                    </span>
                    <span className="font-rajdhani text-xs text-gray-500">
                      {projectData.proyecto.estado === 'Completado' ? '(ENTREGADO)' : 'Fila Activa'}
                    </span>
                  </div>
                </div>
              </div>

              {/* CONTROL DE PROGRESO Y ESTATUS */}
              <div className="space-y-4">
                <div className="flex justify-between items-end">
                  <div className="flex items-center space-x-2">
                    <span className="font-rajdhani text-xs text-gray-400 font-semibold tracking-widest uppercase">Estatus de Manufactura:</span>
                    <span className={`font-orbitron text-xs font-bold px-2 py-0.5 rounded-none ${
                      projectData.proyecto.estado === 'Completado' ? 'bg-green-500/10 text-green-400 border border-green-500/20' :
                      projectData.proyecto.estado === 'En proceso' ? 'bg-cyberPurple/10 text-cyberPurple border border-cyberPurple/20 animate-pulse' :
                      'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'
                    }`}>
                      {projectData.proyecto.estado === 'Completado' && 'COMPLETADO ✅'}
                      {projectData.proyecto.estado === 'En proceso' && 'EN PRODUCCIÓN 🛠️'}
                      {projectData.proyecto.estado === 'En cola' && 'EN COLA ⏳'}
                    </span>
                  </div>
                  <span className="font-orbitron text-sm text-cyberBlue font-black">
                    {projectData.proyecto.porcentaje_avance}%
                  </span>
                </div>

                {/* Barra de Progreso Avanzada */}
                <div className="relative">
                  {/* Carril */}
                  <div className="w-full bg-black/60 h-5 border border-white/5 relative flex justify-between px-2 overflow-hidden items-center select-none">
                    {/* Reglas estéticas */}
                    {[...Array(20)].map((_, i) => (
                      <span key={i} className="ruler-mark"></span>
                    ))}

                    {/* Relleno */}
                    <div
                      className="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-cyberBlue to-cyberPurple transition-all duration-500 z-10"
                      style={{ width: `${projectData.proyecto.porcentaje_avance}%` }}
                    ></div>
                  </div>
                </div>
              </div>

              {/* TIMELINE DE CHECKLIST DE PASOS (READ-ONLY) */}
              <div className="space-y-3">
                <h4 className="font-rajdhani text-xs text-gray-400 font-bold tracking-widest uppercase">CHECKLIS OPERACIONAL</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-56 overflow-y-auto pr-2">
                  {projectData.pasos.map((paso) => (
                    <div key={paso.id_paso} className={`p-3 border flex justify-between items-center bg-black/20 ${paso.completado ? 'border-cyberBlue/20 bg-cyberBlue/5' : 'border-white/5'}`}>
                      <div className="flex items-center space-x-3 truncate">
                        <span className={`w-2 h-2 rounded-none ${paso.completado ? 'bg-cyberBlue shadow-[0_0_8px_#00f2fe]' : 'bg-white/10'}`}></span>
                        <span className={`text-xs truncate ${paso.completado ? 'text-gray-300 font-semibold' : 'text-gray-500'}`}>
                          {paso.numero_paso}. {paso.descripcion}
                        </span>
                      </div>
                      <span className="font-rajdhani text-[10px] text-gray-500">
                        {paso.tiempo_estimado_horas}h
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {/* SECCIÓN DESPACHO LOGÍSTICO Y BITÁCORA */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-white/5">
                
                {/* Bloque Entrega */}
                <div className="border border-white/5 bg-black/30 p-5 flex items-start space-x-4">
                  <div className="w-10 h-10 bg-cyberBlue/10 border border-cyberBlue/20 flex items-center justify-center text-cyberBlue flex-shrink-0">
                    <i data-lucide="calendar" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <span className="font-rajdhani text-[10px] text-gray-500 font-bold tracking-widest uppercase block">
                      Fecha Estimada de Entrega
                    </span>
                    <span className="font-sans text-sm font-semibold text-white block mt-1">
                      {formatFecha(projectData.proyecto.fecha_entrega_manual || projectData.proyecto.fecha_entrega_calculada)}
                    </span>
                    <span className="inline-block mt-2 font-orbitron text-[9px] font-black text-cyberBlue border border-cyberBlue/20 bg-cyberBlue/5 px-2 py-0.5">
                      SEGURIDAD MARGEN: +2 DÍAS INCLUIDOS
                    </span>
                  </div>
                </div>

                {/* Feed de Comentarios (Notas) */}
                <div className="space-y-3">
                  <span className="font-rajdhani text-xs text-gray-400 font-bold tracking-widest uppercase block">
                    BITÁCORA DE HISTORIAL & NOTAS
                  </span>
                  <div className="max-h-36 overflow-y-auto space-y-3 pr-2 border-l border-white/10 pl-4">
                    {projectData.notas.length === 0 ? (
                      <span className="font-rajdhani text-xs text-gray-600 block">No hay notas de taller registradas para este proyecto.</span>
                    ) : (
                      projectData.notas.map((nota) => (
                        <div key={nota.id_nota} className="relative space-y-1">
                          <span className="font-orbitron text-[9px] text-cyberPurple font-semibold block">
                            {new Date(nota.fecha_registro).toLocaleDateString('es-ES')} - {nota.tipo_nota.toUpperCase()}
                          </span>
                          <p className="text-xs text-gray-400 font-sans leading-normal">
                            {nota.nota}
                          </p>
                        </div>
                      ))
                    )}
                  </div>
                </div>

              </div>

              {/* BOTÓN VOLVER */}
              <div className="flex justify-start pt-4 border-t border-white/5">
                <button
                  onClick={handleBack}
                  className="font-rajdhani font-bold text-xs tracking-wider text-cyberBlue hover:text-white transition flex items-center space-x-2"
                >
                  <i data-lucide="arrow-left" className="w-4 h-4"></i>
                  <span>CONSULTAR OTRO CÓDIGO //</span>
                </button>
              </div>

            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackerApp />);
  </script>
</body>
</html>
