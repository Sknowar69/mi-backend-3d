<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - OrgaProp</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyberDark: '#09090e',
            cyberCard: '#13131a',
            cyberBlue: '#00f2fe',
            cyberPurple: '#9d4edd',
            cyberPink: '#ff007f'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Estilos Cyberpunk Personalizados -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090e;
      color: #ffffff;
      overflow-x: hidden;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    
    .font-rajdhani {
      font-family: 'Rajdhani', sans-serif;
    }

    /* Cuadrícula de Fondo */
    .bg-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 242, 254, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Línea Scanline */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(0, 242, 254, 0.05);
      z-index: 50;
      pointer-events: none;
      animation: scanlineAnim 6s linear infinite;
    }

    @keyframes scanlineAnim {
      0% { top: -10px; }
      100% { top: 100%; }
    }

    /* Tarjeta Ciberpunk con Corchetes */
    .cyber-card {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(19, 19, 26, 0.85);
      backdrop-filter: blur(8px);
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 10px;
      height: 10px;
      border-top: 2px solid #00f2fe;
      border-left: 2px solid #00f2fe;
    }

    .cyber-card::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-bottom: 2px solid #9d4edd;
      border-right: 2px solid #9d4edd;
    }
  </style>

  <!-- React y Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="relative min-h-screen bg-cyberDark">

  <!-- Capas de fondo ambientación -->
  <div class="absolute inset-0 bg-grid z-0"></div>
  <div class="scanline"></div>

  <!-- Contenedor Principal SPA -->
  <div id="root" class="relative z-10 w-full min-h-screen flex flex-col justify-between"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function AdminDashboardApp() {
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [colaborador, setColaborador] = useState(null);
      const [kpis, setKpis] = useState({
        totalCollabs: 0,
        activeCollabs: 0,
        blockedCollabs: 0,
        activeProjects: 0,
        avgProgress: 0
      });

      const barChartRef = useRef(null);
      const lineChartRef = useRef(null);
      const barChartInstance = useRef(null);
      const lineChartInstance = useRef(null);

      // Autenticación de súper administrador
      useEffect(() => {
        async function checkAdminSession() {
          try {
            const res = await fetch('/api/config');
            if (!res.ok) {
              window.location.href = '../login.html';
              return;
            }
            const config = await res.json();
            const client = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
            setSupabaseClient(client);

            const { data: { session } } = await client.auth.getSession();
            if (!session) {
              window.location.href = '../login.html';
              return;
            }

            const { data: collab } = await client
              .from('colaboradores')
              .select('*')
              .eq('id_colaborador', session.user.id)
              .single();

            if (!collab || !collab.es_admin || !collab.activo) {
              alert('ACCESO DENEGADO: Requiere privilegios de Súper Administrador.');
              window.location.href = '../login.html';
              return;
            }
            setColaborador(collab);
          } catch (e) {
            console.error(e);
            window.location.href = '../login.html';
          }
        }
        checkAdminSession();
      }, []);

      // Cargar métricas y construir gráficos
      useEffect(() => {
        if (supabaseClient) {
          loadMetricsAndBuildCharts();
        }
      }, [supabaseClient]);

      const loadMetricsAndBuildCharts = async () => {
        try {
          // 1. Fetch colaboradores y calcular kpis
          const { data: collabs } = await supabaseClient
            .from('colaboradores')
            .select('*');

          const { data: activeProjs } = await supabaseClient
            .from('proyectos')
            .select('porcentaje_avance')
            .neq('estado', 'Completado');

          const { data: allProjs } = await supabaseClient
            .from('proyectos')
            .select('porcentaje_avance');

          const totalCol = collabs ? collabs.length : 0;
          const activeCol = collabs ? collabs.filter(c => c.activo).length : 0;
          const blockedCol = totalCol - activeCol;
          const activeProjectsCount = activeProjs ? activeProjs.length : 0;
          const avgProgress = allProjs && allProjs.length > 0
            ? Math.round(allProjs.reduce((acc, p) => acc + p.porcentaje_avance, 0) / allProjs.length)
            : 0;

          setKpis({
            totalCollabs: totalCol,
            activeCollabs: activeCol,
            blockedCollabs: blockedCol,
            activeProjects: activeProjectsCount,
            avgProgress: avgProgress
          });

          // 2. Fetch para Gráfico de Barras: Proyectos activos por Colaborador
          const { data: barData } = await supabaseClient
            .from('proyectos')
            .select('id_colaborador, colaboradores(nombre)')
            .neq('estado', 'Completado');

          const collabsMap = {};
          barData?.forEach(p => {
            const name = p.colaboradores?.nombre || 'Desconocido';
            collabsMap[name] = (collabsMap[name] || 0) + 1;
          });

          const barLabels = Object.keys(collabsMap);
          const barValues = Object.values(collabsMap);

          // 3. Fetch para Gráfico de Líneas: Avance promedio por Rubro comercial
          // Obtenemos proyectos, colaboradores y rubros
          const { data: lineData } = await supabaseClient
            .from('proyectos')
            .select('porcentaje_avance, colaboradores(id_rubro, rubros(nombre))');

          const rubrosMap = {};
          lineData?.forEach(p => {
            const name = p.colaboradores?.rubros?.nombre || 'Sin Rubro';
            if (!rubrosMap[name]) rubrosMap[name] = { sum: 0, count: 0 };
            rubrosMap[name].sum += p.porcentaje_avance;
            rubrosMap[name].count += 1;
          });

          const lineLabels = Object.keys(rubrosMap);
          const lineValues = lineLabels.map(label => Math.round(rubrosMap[label].sum / rubrosMap[label].count));

          // Renderizar gráficos
          renderCharts(barLabels, barValues, lineLabels, lineValues);

        } catch (e) {
          console.error(e);
        }
      };

      const renderCharts = (barLabels, barValues, lineLabels, lineValues) => {
        const ctxBar = barChartRef.current.getContext('2d');
        const ctxLine = lineChartRef.current.getContext('2d');

        // Destruir instancias previas si existen
        if (barChartInstance.current) barChartInstance.current.destroy();
        if (lineChartInstance.current) lineChartInstance.current.destroy();

        // Configuración común de estilo
        const commonOptions = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#9ca3af',
                font: { family: 'Rajdhani', size: 12 }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af', font: { family: 'Rajdhani' } }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af', font: { family: 'Rajdhani' } }
            }
          }
        };

        // Gráfico de Barras (Cian)
        barChartInstance.current = new Chart(ctxBar, {
          type: 'bar',
          data: {
            labels: barLabels.length > 0 ? barLabels : ['Sin datos'],
            datasets: [{
              label: 'Proyectos Activos',
              data: barValues.length > 0 ? barValues : [0],
              backgroundColor: 'rgba(0, 242, 254, 0.4)',
              borderColor: '#00f2fe',
              borderWidth: 1
            }]
          },
          options: commonOptions
        });

        // Gráfico de Línea (Morado)
        lineChartInstance.current = new Chart(ctxLine, {
          type: 'line',
          data: {
            labels: lineLabels.length > 0 ? lineLabels : ['Sin datos'],
            datasets: [{
              label: 'Progreso Promedio (%)',
              data: lineValues.length > 0 ? lineValues : [0],
              backgroundColor: 'rgba(157, 78, 237, 0.2)',
              borderColor: '#9d4edd',
              borderWidth: 2,
              fill: true,
              tension: 0.3
            }]
          },
          options: commonOptions
        });
      };

      return (
        <React.Fragment>
          {/* BARRA DE NAVEGACIÓN */}
          <nav className="relative z-10 w-full px-6 py-4 flex justify-between items-center border-b border-white/5 bg-cyberCard/90 backdrop-blur-md">
            <div className="font-orbitron font-bold text-sm tracking-wider flex items-center space-x-2">
              <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyberBlue to-cyberPurple">ORGAPROP</span>
              <span className="text-white">/</span>
              <span className="text-cyberBlue text-xs font-black">PANEL CONTROL DIOS</span>
            </div>

            <div className="flex items-center space-x-6 font-rajdhani text-xs font-bold tracking-widest">
              <a href="dashboard.html" className="text-cyberBlue underline">MÉTRICAS</a>
              <a href="usuarios.html" className="text-gray-400 hover:text-white transition">COLABORADORES</a>
              <a href="proyectos.html" className="text-gray-400 hover:text-white transition">AUDITORÍA</a>
              <a href="../colaboradores.html" className="text-cyberPurple border border-cyberPurple/20 bg-cyberPurple/5 px-3 py-1.5 hover:bg-cyberPurple hover:text-cyberDark transition">
                VOLVER AL TALLER
              </a>
            </div>
          </nav>

          {/* CUERPO CENTRAL DE MÉTRICAS */}
          <div className="flex-grow max-w-5xl w-full mx-auto p-6 space-y-8">
            
            <div className="flex justify-between items-center pb-2 border-b border-white/5">
              <h2 className="font-orbitron text-sm tracking-widest font-black text-gray-400">
                SITUACIÓN GLOBAL DE LA PLATAFORMA
              </h2>
              <span className="font-rajdhani text-[10px] text-cyberBlue font-bold">MÉTRICAS EN TIEMPO REAL</span>
            </div>

            {/* GRILLA DE TARJETAS DE MÉTRICAS (KPIs) */}
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
              <div className="cyber-card p-5">
                <span className="font-rajdhani text-[10px] text-gray-500 font-bold block uppercase tracking-wider">Colaboradores Registrados</span>
                <span className="font-orbitron text-2xl font-black text-white block mt-1">{kpis.totalCollabs}</span>
              </div>

              <div className="cyber-card p-5">
                <span className="font-rajdhani text-[10px] text-gray-500 font-bold block uppercase tracking-wider">Socios Activos / Congelados</span>
                <div className="flex items-baseline space-x-2 mt-1">
                  <span className="font-orbitron text-2xl font-black text-cyberBlue">{kpis.activeCollabs}</span>
                  <span className="font-sans text-xs text-gray-500">/</span>
                  <span className="font-orbitron text-lg font-black text-cyberPink">{kpis.blockedCollabs}</span>
                </div>
              </div>

              <div className="cyber-card p-5">
                <span className="font-rajdhani text-[10px] text-gray-500 font-bold block uppercase tracking-wider">Proyectos Activos en Cola</span>
                <span className="font-orbitron text-2xl font-black text-cyberPurple block mt-1">{kpis.activeProjects}</span>
              </div>

              <div className="cyber-card p-5">
                <span className="font-rajdhani text-[10px] text-gray-500 font-bold block uppercase tracking-wider">Efectividad General (Promedio)</span>
                <span className="font-orbitron text-2xl font-black text-green-400 block mt-1">{kpis.avgProgress}%</span>
              </div>
            </div>

            {/* GRÁFICOS CHART.JS */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              {/* Gráfico 1 */}
              <div className="cyber-card p-5 space-y-4">
                <h3 className="font-orbitron text-xs font-bold text-cyberBlue tracking-wider uppercase">
                  Volumen de Órdenes Activas por Colaborador
                </h3>
                <div className="h-64 relative">
                  <canvas ref={barChartRef}></canvas>
                </div>
              </div>

              {/* Gráfico 2 */}
              <div className="cyber-card p-5 space-y-4">
                <h3 className="font-orbitron text-xs font-bold text-cyberPurple tracking-wider uppercase">
                  Velocidad de Despacho y Avance por Rubro Comercial
                </h3>
                <div className="h-64 relative">
                  <canvas ref={lineChartRef}></canvas>
                </div>
              </div>

            </div>

          </div>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminDashboardApp />);
  </script>
</body>
</html>
